plugins {
    id "com.android.application"
}

android {
    namespace "com.fiesta.launcher"
    compileSdk 37
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.fiesta.launcher"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }

    base {
        archivesName = "FiestaLauncher"
    }
}
